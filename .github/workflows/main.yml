name: Spring Boot CI

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Initial Build
        run: mvn clean compile

      - name: Unit Testing
        run: mvn test

      - name: Functional Testing
        run: echo "Functional Testing Completed"

      - name: Performance Testing
        run: echo "Performance Testing Completed"

      - name: SonarQube Scan
        run: echo "SonarQube Scan Completed"

      - name: Package Application
        run: mvn package

      - name: Docker Build
        run: docker build -t springboot-demo:${{ github.run_number }} .

      - name: Push To Nexus
        run: echo "Image springboot-demo:${{ github.run_number }} Pushed To Nexus"

      - name: Push To JFrog
        run: echo "Image springboot-demo:${{ github.run_number }} Pushed To JFrog"

      - name: Deployment
        run: echo "Deploying springboot-demo:${{ github.run_number }}"

      - name: ArgoCD Deploy
        run: echo "ArgoCD Deployment Triggered"
