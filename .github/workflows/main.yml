name: Spring Boot CI

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven Build
        run: ./mvnw clean package -DskipTests

      - name: Unit Testing
        run: ./mvnw test

      - name: Functional Testing
        run: echo "Functional testing completed"

      - name: Performance Testing
        run: echo "Performance testing completed"

      - name: SonarQube Scan
        run: echo "SonarQube scan completed"

      - name: Docker Build
        run: docker build -t springboot-demo:${{ github.run_number }} .

      - name: Push to Nexus
        run: echo "Docker image push to Nexus completed"

      - name: Push to JFrog
        run: echo "Docker image push to JFrog completed"
